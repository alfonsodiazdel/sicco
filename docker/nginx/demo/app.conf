# Bloque común de la demo: SPA compilada + API Laravel + Mailpit.
# Se incluye desde http.conf.template o https.conf.template.

root /var/www/frontend/dist;
index index.html;
client_max_body_size 20M;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# DNS interno de Docker: resuelve los contenedores en cada petición, así nginx
# no queda apuntando a una IP vieja cuando se recrea uno.
resolver 127.0.0.11 valid=10s;
set $php_upstream php:9000;
set $mailpit_upstream http://mailpit:8025;

# SPA: cualquier ruta que no sea un archivo la resuelve vue-router.
location / {
    try_files $uri $uri/ /index.html;
}

location = /index.html {
    expires -1;
}

# Vite genera nombres con hash, se pueden cachear sin límite.
location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
}

# API, cookie CSRF de Sanctum y health check de Laravel.
location ~ ^/(api|sanctum|up)(/|$) {
    fastcgi_pass $php_upstream;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_hide_header X-Powered-By;
}

# Mailpit (protegido con usuario y contraseña: MAILPIT_UI_AUTH).
location /mailpit/ {
    proxy_pass $mailpit_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location ~ /\.(?!well-known) {
    deny all;
}
